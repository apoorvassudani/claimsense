# CI/CD for ClaimSense
#   CI: on every push and pull request, run the backend tests and build the frontend.
#   CD: on a push to main (or a manual run), when both pass, package the app and deploy it to Azure App Service.
#
# CD setup (once), for the Azure VM deployment (see deploy/VM-DEPLOY.md):
#   GitHub repo > Settings > Secrets and variables > Actions
#     Variables: ACR_NAME (registry name), VM_HOST (VM public IP), VM_USER (e.g. azureuser)
#     Secrets:   ACR_USERNAME, ACR_PASSWORD (registry > Access keys, admin user), VM_PASSWORD
# Without ACR_PASSWORD the deploy job is skipped and CI still runs.
name: ci-cd
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  deploy:
    needs: [backend-tests, frontend-build]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when CD is not configured
        if: env.ACR_PASSWORD == ''
        run: echo "ACR_PASSWORD secret not set; skipping deployment."
      - name: Sign in to Azure Container Registry
        if: env.ACR_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build and push the image (tagged with the commit and latest)
        if: env.ACR_PASSWORD != ''
        run: |
          IMAGE=${{ vars.ACR_NAME }}.azurecr.io/claimsense
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      - name: Roll out on the VM
        if: env.ACR_PASSWORD != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd ~/claimsense
            export ACR=${{ vars.ACR_NAME }} TAG=${{ github.sha }}
            docker compose -f docker-compose.vm.yml pull app
            docker compose -f docker-compose.vm.yml up -d
      - name: Smoke test
        if: env.ACR_PASSWORD != ''
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "http://${{ vars.VM_HOST }}/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed after deployment"; exit 1
